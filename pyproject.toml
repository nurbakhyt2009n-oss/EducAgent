[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "educa-agent"
version = "0.1.0"
description = "Локальный ИИ-тьютор для подготовки к СОР и СОЧ НИШ"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nurbakyt" }]
# Зависимости этапа 0 (каркас). Полный стек всех этапов — в requirements.txt
# и в extras ниже; они подключаются по мере реализации слоёв.
dependencies = [
    "ollama>=0.6",
    "anthropic>=2.3,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2",
    "typer>=0.27",
    "rich>=15.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
ingestion = [
    "python-pptx>=1.0.2,<2",
    "pymupdf>=2.0,<3",
    "pymupdf4llm>=2.0,<3",
    "pytesseract>=0.3.13",
    "pillow>=13.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2",
    "pandas>=3.1,<4",
    "lingua-language-detector>=2.2",
    "rapidfuzz>=3.14",
]
memory = [
    "chromadb>=1.5,<2",
    "sentence-transformers>=6.2,<7",
    "torch>=2.15",
    "rank-bm25>=0.2.2",
    "networkx>=3.7,<4",
    "numpy>=2.5,<3",
    "scikit-learn>=1.9,<2",
    "fsrs>=6.3,<7",
]
tutor = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "sympy>=1.14",
    "orjson>=3.13",
    "tenacity>=9.2",
]
ui = [
    "streamlit>=1.66",
    "pyvis>=0.3.2",
    "plotly>=7.1",
]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML",
]
all = ["educa-agent[ingestion,memory,tutor,ui]"]

[project.scripts]
educa = "educa_agent.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/educa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: медленные тесты с реальными файлами и БД"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/educa_agent/memory/db/migrations/versions"]  # генерирует Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
